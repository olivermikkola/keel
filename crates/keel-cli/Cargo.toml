[package]
name = "keel-cli"
description = "keel command line entrypoint"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
keel-kernel = { path = "../keel-kernel" }
keel-agent = { path = "../keel-agent" }
serde_json = "1"
anyhow = "1"
libc = "0.2"
ratatui = "=0.30.2"
crossterm = "=0.29.0"
