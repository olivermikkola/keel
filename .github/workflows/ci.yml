name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Configure Git author identity
        run: |
          git config --global user.email "keel@local"
          git config --global user.name "keel"

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check benchmark analysis
        run: python3 -m unittest discover -s bench/polyglot -p 'test_*.py'

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --locked --verbose

      - name: Build release binary
        run: cargo build --release --locked

      - name: Check sandboxed benchmark execution
        env:
          KEEL_BENCH_SANDBOX_TESTS: '1'
          KEEL_TEST_BIN: ${{ github.workspace }}/target/release/keel
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-pytest
          python3 -m unittest discover -s bench/polyglot -p 'test_*.py' -v

  check-macos:
    name: Build, Lint & Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Configure Git author identity
        run: |
          git config --global user.email "keel@local"
          git config --global user.name "keel"

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --locked --verbose -- --skip daemon::tests::acp_daemon_

  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
